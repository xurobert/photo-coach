[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-coach"
version = "0.1.0"
description = "Local-first photo culling, scoring, trend tips, and semantic search for photographers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xurobert" }]
dependencies = [
  "pillow>=10.0",
  "imagehash>=4.3",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]

[project.scripts]
photo-coach = "photo_coach.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["photo_coach*"]
